name: EAS Update Preview
on:
  push:
    branches: [prod]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npx eas login --token ${{ secrets.EAS_TOKEN }}
      - run: npx eas update --branch preview --message "CI update from prod"